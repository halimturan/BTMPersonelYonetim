
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        HTTP_PROXY: http://halim.turan:1967_Ymtmbt!@proxy3.ibb.gov.tr:8080
        HTTPS_PROXY: http://halim.turan:1967_Ymtmbt!@proxy3.ibb.gov.tr:8080
        NO_PROXY: localhost,127.0.0.1,db,web,nginx
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    networks:
      - default


  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Istanbul
      BACKUP_RETENTION_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    command: ["/bin/bash", "/scripts/backup-loop.sh"]

volumes:
  postgres_data:
  static_data:
  media_data:
