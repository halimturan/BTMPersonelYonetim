{% load static %}
<!DOCTYPE html>
<html lang="tr" >
    <!--begin::Head-->
    <head>
        <title>İBB - BTM Personel Değerlendirme</title>
        <meta charset="utf-8"/>
        <meta name="description" content="Bilgi Teknolojileri Müdürlüğü personel değerlendirme platformudur."/>
        <meta name="keywords" content="İBB, BTM, Personel değerlendirme, performans ölçme"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta property="og:locale" content="tr_TR" />
        <meta property="og:type" content="article" />
        <meta property="og:title" content="İBB - BTM Personel Değerlendirme" />
        <meta property="og:url" content="https://ibb.gov.tr"/>
        <meta property="og:site_name" content="İBB- BTM" />
        <link rel="canonical" href="https://btmpersonel.ibb.gov.tr"/>
        <link rel="shortcut icon" href="{% static 'img/logo.webp' %}"/>

        <!--begin::Fonts(mandatory for all pages)-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>        <!--end::Fonts-->

        <!--begin::Global Stylesheets Bundle(mandatory for all pages)-->
        <link href="{% static 'lib/metronic/assets/plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css"/>
        <link href="{% static 'lib/metronic/assets/css/style.bundle.css' %}" rel="stylesheet" type="text/css"/>
        <!--end::Global Stylesheets Bundle-->

        <script>
            // Frame-busting to prevent site from being loaded within a frame without permission (click-jacking)
            if (window.top != window.self) {
                window.top.location.replace(window.self.location.href);
            }
        </script>
    </head>
    <!--end::Head-->

    <!--begin::Body-->
    <body  id="kt_body"  class="app-blank bgi-size-cover bgi-attachment-fixed bgi-position-center bgi-no-repeat" >
        <!--begin::Theme mode setup on page load-->
        <script>
	        var defaultThemeMode = "light";
	        var themeMode;

            if ( document.documentElement ) {
                if ( document.documentElement.hasAttribute("data-bs-theme-mode")) {
                    themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
                } else {
                    if ( localStorage.getItem("data-bs-theme") !== null ) {
                        themeMode = localStorage.getItem("data-bs-theme");
                    } else {
                        themeMode = defaultThemeMode;
                    }
                }

                if (themeMode === "system") {
                    themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }

                document.documentElement.setAttribute("data-bs-theme", themeMode);
            }
        </script>
        <!--end::Theme mode setup on page load-->

        <!--begin::Root-->
        <div class="d-flex flex-column flex-root" id="kt_app_root">
            <!--begin::Page bg image-->
            <style>
                body {
                    background-image: url('{% static "img/login_bg.webp" %}');
                }

                [data-bs-theme="dark"] body {
                    background-image: url('{% static "img/login_bg.webp" %}');
                }
            </style>
            <!--end::Page bg image-->

            <!--begin::Authentication - Sign-in -->
            <div class="d-flex flex-column flex-column-fluid flex-lg-row">
                <!--begin::Body-->
                <div class="d-flex flex-column-fluid ms-xxl-20 flex-lg-row-auto justify-content-center justify-content-lg-end p-12 p-lg-20">
                    <!--begin::Card-->
                    <div class="bg-body ms-xxl-20  d-flex flex-column align-items-stretch flex-center rounded-4 w-md-600px p-20">
                        <!--begin::Wrapper-->
                        <div class="d-flex flex-center flex-column flex-column-fluid px-lg-10 pb-15 pb-lg-20">
                            <!--begin::Form-->
                            <form class="form w-100" method="post">
                                {% csrf_token %}

                                <!--begin::Heading-->
                                <div class="text-center mb-11">
                                    <!--begin::Title-->
                                    <h1 class="text-gray-900 fw-bolder mb-3">
                                        Bilgi Teknolojileri Müdürlüğü
                                    </h1>
                                    <!--end::Title-->

                                    <!--begin::Subtitle-->
                                    <div class="text-gray-500 fw-semibold fs-6">
                                        Personel Değerlendirme Uygulaması
                                    </div>
                                    <!--end::Subtitle--->
                                </div>
                                <!--begin::Heading-->

                                <!--begin::Heading-->
                                <div class="text-center mb-11">
                                    <!--begin::Title-->
                                    <h1 class="text-gray-900 fw-bolder mb-3">
                                       Oturum Aç
                                    </h1>
                                    <!--end::Title-->
                                </div>
                                <!--begin::Heading-->

                                <!--begin::Input group--->
                                <div class="fv-row mb-8">
                                    <!--begin::Email-->
                                    <input type="text" placeholder="Kullanıcı Adı" name="username" autocomplete="off" class="form-control bg-transparent" required/>
                                    <!--end::Email-->
                                </div>

                                <!--end::Input group--->
                                <div class="fv-row mb-3">
                                    <!--begin::Password-->
                                    <input type="password" placeholder="Parola" name="password" autocomplete="off" class="form-control bg-transparent" required/>
                                    <!--end::Password-->
                                </div>
                                <!--end::Input group--->

                                <!--begin::Submit button-->
                                <div class="d-grid mb-10 mt-xxl-20">
                                    <button type="submit" id="kt_sign_in_submit" class="btn btn-primary">
                                        <!--begin::Indicator label-->
                                        <span class="indicator-label">
                                            Oturum Aç
                                        </span>
                                        <!--end::Indicator label-->

                                        <!--begin::Indicator progress-->
                                        <span class="indicator-progress">
                                            Please wait...    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                                        </span>
                                        <!--end::Indicator progress-->
                                    </button>
                                </div>
                                <!--end::Submit button-->
                            </form>
                            <!--end::Form-->
                        </div>
                        <!--end::Wrapper-->
                    </div>
                    <!--end::Card-->
                </div>
                <!--end::Body-->
            </div>
            <!--end::Authentication - Sign-in-->
        </div>
        <!--end::Root-->

        <!--begin::Javascript-->
        <script>
            var hostUrl = "/metronic8/demo1/assets/";
        </script>

        <!--begin::Global Javascript Bundle(mandatory for all pages)-->
        <script src="{% static 'lib/metronic/assets/plugins/global/plugins.bundle.js' %}"></script>
        <script src="{% static 'lib/metronic/assets/js/scripts.bundle.js' %}"></script>
        <!--end::Global Javascript Bundle-->


        <!--begin::Custom Javascript(used for this page only)-->
        <script src="{% static 'lib/metronic/assets/js/custom/authentication/sign-in/general.js' %}"></script>
        <!--end::Custom Javascript-->
        <!--end::Javascript-->
    </body>
    <!--end::Body-->
</html>
