
<!--begin::User account menu-->
<div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px" data-kt-menu="true">
    <!--begin::Menu item-->
    <div class="menu-item px-3">
        <div class="menu-content d-flex align-items-center px-3">
            <!--begin::Avatar-->
            <div class="symbol symbol-50px me-5">
                <i class="ki-duotone ki-user-square fs-2hx">
                 <span class="path1"></span>
                 <span class="path2"></span>
                 <span class="path3"></span>
                </i>
            </div>
            <!--end::Avatar-->
            <!--begin::Username-->
            <div class="d-flex flex-column">
                <div class="fw-bold d-flex align-items-center fs-5">
                    {{ request.user.employee.full_name }}                   
                </div>
                <div class="fw-semibold text-muted fs-7">
                     {{ request.user.employee.current_title|default:"-" }}                
                </div>
            </div>
            <!--end::Username-->
        </div>
    </div>
    <!--end::Menu item-->
    <!--begin::Menu separator-->
    <div class="separator my-2"></div>
    <!--end::Menu separator-->
    <!--begin::Menu item-->
    <div class="menu-item px-5">
        <a href="{% url 'employees:employee_detail' request.user.employee.pk %}" class="menu-link px-5">
            Profilim
        </a>
    </div>
    <!--end::Menu item-->
    <!--begin::Menu item-->
    <div class="menu-item px-5">
        <a href="{% url 'accounts:password_change' %}" class="menu-link px-5">
            Parola değiştir
        </a>
    </div>
    <!--end::Menu item-->
    <!--begin::Menu item-->
    <form method="post" action="{% url 'accounts:logout' %}" id="logoutForm">
        {% csrf_token %}
        <div class="menu-item px-5">
                <a class="menu-link px-5" id="logout_btn">
                Çıkış yap
            </a>
        </div>
    </form>
    <!--end::Menu item-->
</div>
<!--end::User account menu-->

<script>
    document.getElementById('logout_btn').addEventListener('click', function(event) {
      event.preventDefault(); 
      document.getElementById('logoutForm').submit();
    });
</script>
