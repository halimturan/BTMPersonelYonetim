{% load static %}
<!DOCTYPE html>
<html lang="tr" >
    <!--begin::Head-->
    <head>
        <meta charset="utf-8"/>
        <meta name="description" content="Bilgi Teknolojileri Müdürlüğü personel değerlendirme platformudur."/>
        <meta name="keywords" content="İBB, BTM, Personel değerlendirme, performans ölçme"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta property="og:locale" content="tr_TR" />
        <meta property="og:type" content="article" />
        <meta property="og:title" content="İBB - BTM Personel Değerlendirme" />
        <meta property="og:url" content="https://ibb.gov.tr"/>
        <meta property="og:site_name" content="İBB- BTM" />
        <link rel="canonical" href="https://btmpersonel.ibb.gov.tr"/>
        <link rel="shortcut icon" href="{% static 'img/logo.png' %}"/>

        <!--begin::Fonts(mandatory for all pages)-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>        <!--end::Fonts-->

        <!--begin::Global Stylesheets Bundle(mandatory for all pages)-->
        <link href="{% static 'lib/metronic/assets/plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css"/>
        <link href="{% static 'lib/metronic/assets/css/style.bundle.css' %}" rel="stylesheet" type="text/css"/>
        <!--end::Global Stylesheets Bundle-->

        <title>
            {% block title %}{% endblock %} - BTM Personel Performans Yönetimi
        </title>

        <script>
            // Frame-busting to prevent site from being loaded within a frame without permission (click-jacking)
            if (window.top != window.self) {
                window.top.location.replace(window.self.location.href);
            }
        </script>
    </head>
    <!--end::Head-->

    <!--begin::Body-->
    <body  id="kt_app_body" data-kt-app-layout="light-sidebar" data-kt-app-header-fixed="true" data-kt-app-sidebar-enabled="true" data-kt-app-sidebar-fixed="true" data-kt-app-sidebar-hoverable="true" data-kt-app-sidebar-push-header="true" data-kt-app-sidebar-push-toolbar="true" data-kt-app-sidebar-push-footer="true" data-kt-app-toolbar-enabled="true"  class="app-default" >
        <!--begin::App-->
        <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
            <!--begin::Page-->
            <div class="app-page flex-column flex-column-fluid" id="kt_app_page">
                <!--begin::Header-->
                {% include 'core/layout/header.html' %}
                <!--end::Header-->
                <!--begin::Wrapper-->
                <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
                    <!--begin::Sidebar-->
                    {% include 'core/layout/sidebar.html' %}
                    <!--end::Sidebar-->
                    <!--begin::Main-->
                    <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
                        <!--begin::Content wrapper-->
                        <div class="d-flex flex-column flex-column-fluid">
                            <!--begin::Content-->
                            <div id="kt_app_content" class="app-content flex-column-fluid">
                                <!--begin::Content container-->
                                <div id="kt_app_content_container" class="app-container container-fluid">
                                    {% block content %}
                                    {% endblock %}
                                </div>
                                <!--end::Content container-->
                            </div>
                            <!--end::Content-->
                        </div>
                        <!--end::Content wrapper-->
                    </div>
                    <!--end::Main-->
                </div>
                <!--end::Wrapper-->
            </div>
            <!--end::Page-->
        </div>
        <!--end::App-->
        <!--begin::Global Javascript Bundle(mandatory for all pages)-->
        <script src="{% static 'lib/metronic/assets/plugins/global/plugins.bundle.js' %}"></script>
        <script src="{% static 'lib/metronic/assets/js/scripts.bundle.js' %}"></script>
        <!--end::Global Javascript Bundle-->
        <!--end::Custom Javascript-->
        {% block extra_scripts %}{% endblock %}
        <!--end::Javascript-->
    </body>
    <!--end::Body-->
</html>
